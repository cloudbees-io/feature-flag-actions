apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: set-rollout-split
description: 'Set a true/false percentage split on the default configuration of a Feature Flag'

inputs:
  api_token:
    description: "API token"
    required: false
    default: ""
  app_id:
    description: "The Unify Application ID"
    required: true
  env_id:
    description: "The Unify Environment ID"
    required: true
  flag_id:
    description: "The Unify Feature Flag ID"
    required: true
  percent-true:
    description: "The percentage of users (0-100) that should receive the true flag value"
    required: true
  percent-false:
    description: "The percentage of users (0-100) that should receive the false flag value. If not provided, or if percent-true + percent-false exceeds 100, defaults to 100 minus percent-true."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: build-payload
      name: Build rollout split payload
      uses: docker://alpine:3
      env:
        PERCENT_TRUE: ${{ inputs.percent-true }}
        PERCENT_FALSE: ${{ inputs.percent-false }}
      run: |
        set -eu
        apk add --no-cache jq >/dev/null 2>&1

        # Validate percent-true is an integer between 0 and 100.
        if ! echo "$PERCENT_TRUE" | grep -qE '^[0-9]+$' || [ "$PERCENT_TRUE" -gt 100 ]; then
          echo "Error: percent-true must be an integer between 0 and 100" >&2
          exit 1
        fi

        # If percent-false was not provided, derive it from percent-true.
        if [ -z "$PERCENT_FALSE" ]; then
          PERCENT_FALSE=$(( 100 - PERCENT_TRUE ))
        elif ! echo "$PERCENT_FALSE" | grep -qE '^[0-9]+$' || [ "$PERCENT_FALSE" -gt 100 ]; then
          echo "Error: percent-false must be an integer between 0 and 100" >&2
          exit 1
        elif [ $(( PERCENT_TRUE + PERCENT_FALSE )) -gt 100 ]; then
          # Combined percentage exceeds 100 — recalculate percent-false to complement percent-true.
          echo "Warning: percent-true (${PERCENT_TRUE}) + percent-false (${PERCENT_FALSE}) exceeds 100. Ignoring percent-false and deriving it as $(( 100 - PERCENT_TRUE ))." >&2
          PERCENT_FALSE=$(( 100 - PERCENT_TRUE ))
        fi

        # Build the defaultValue payload using jq so the numbers are typed
        # correctly as JSON integers rather than strings.
        PAYLOAD=$(jq -n \
          --argjson t "$PERCENT_TRUE" \
          --argjson f "$PERCENT_FALSE" \
          '{"defaultValue":[{"option":true,"percentage":$t},{"option":false,"percentage":$f}]}')

        echo -n "$PAYLOAD" > $CLOUDBEES_OUTPUTS/payload

    - id: set-rollout-split
      name: Patch Feature Flag default rollout split
      uses: cloudbees-io/feature-flag-actions/internal/patch-flag@v1
      with:
        api_token: ${{ inputs.api_token }}
        app_id: ${{ inputs.app_id }}
        env_id: ${{ inputs.env_id }}
        flag_id: ${{ inputs.flag_id }}
        payload: ${{ steps.build-payload.outputs.payload }}
